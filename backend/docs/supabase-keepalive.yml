# Chuyển file này thành  .github/workflows/supabase-keepalive.yml  trong repo GitHub của bạn.
# Mỗi 3 ngày gọi 1 request tới project để Supabase Free không coi là "không hoạt động" và pause.
# Cần 2 Secret (Repo > Settings > Secrets and variables > Actions):
#   SUPABASE_URL       ví dụ https://abcdxyz.supabase.co
#   SUPABASE_ANON_KEY  anon public key (Project Settings > API)
# Lưu ý: đây là cách phổ biến của cộng đồng chứ không phải cam kết chính thức của Supabase;
# hãy kiểm tra Dashboard sau 1-2 tuần để chắc chắn project không bị pause.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"     # 03:17 UTC, cách 3 ngày
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "HTTP $code"
          test "$code" -lt 500
